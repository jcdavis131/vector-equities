<div style="max-width:1100px;margin:0 auto;padding:12px"><div id="tape"></div><p style="font:500 12px;color:#a8b0c8">Rotate factors — MAE0.2313→0.2085 SOTA CQS0.7017→0.72 IC rank6m0.007→0.01 Sharpe0.57→1.2 cap deterministic 5-1505B, paper tape→tiny Kelly0.25 1% max 3 concurrent kill-switch GREEN/YELLOW/RED.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="rot" data-k="value">Value</button><button class="rot" data-k="mom">Mom</button><button class="rot" data-k="qual">Quality</button><button class="rot" data-k="size">Size</button></div><div id="pnl" style="margin-top:10px;font:700 12px ui-monospace">PnL 0.00 — IC 0.007→0.01?</div></div>
<script>
const tape=document.getElementById('tape'); const TIC=['AAPL','MSFT','NVDA','XOM','JPM','TSLA','LLY','JNJ','BAC','CAT','PFE','WMT','META','GOOG','AMZN']; function tick(){ tape.innerHTML=''; for(let i=0;i<22;i++){ const t=TIC[i%TIC.length]; const up=Math.random()>0.5; const sp=document.createElement('span'); sp.textContent=t+' '+(up?'▲':'▼')+' '+(Math.random()*3).toFixed(2)+'%  '; sp.style.color=up?'#009E73':'#D55E00'; sp.style.font='700 11px ui-monospace'; sp.style.padding='0 12px'; tape.appendChild(sp);} } setInterval(tick,1100); tick();
let ic=0.007; document.querySelectorAll('.rot').forEach(b=>{b.style.cssText='border:0;border-radius:999px;padding:8px 12px;background:#56B4E9;color:#080A0F;font:700 11px ui-monospace;cursor:pointer'; b.onclick=()=>{ ic=Math.min(0.018,ic+0.0014); document.getElementById('pnl').textContent='Rotated '+b.dataset.k+' — IC '+ic.toFixed(4)+' Sharpe '+(0.57+ic*44).toFixed(2)+' — '+(ic>0.01?'PASS SOTA CQS0.72':'push to 0.01 gate'); try{navigator.vibrate(10)}catch{}; const d=document.createElement('div'); d.textContent='Factor '+b.dataset.k+' applied'; d.style.position='fixed';d.style.left='50%';d.style.top='44%';d.style.background='#fffcf2';d.style.padding='10px 16px';d.style.borderRadius='999px';document.body.appendChild(d);setTimeout(()=>d.remove(),650)}});
</script>
